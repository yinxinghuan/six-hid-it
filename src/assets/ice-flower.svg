<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Little 6 ice flower seal</title>
  <desc id="desc">A dimensional six-point crystal flower with a raised Little 6 enamel mark.</desc>
  <defs>
    <linearGradient id="crystalFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ffff" stop-opacity=".96"/>
      <stop offset=".38" stop-color="#cfe6e7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#82aaad" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="crystalLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#b5d4d6" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="crystalSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7da4a6" stop-opacity=".82"/>
      <stop offset="1" stop-color="#4f777a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ded8ce"/>
    </linearGradient>
    <filter id="objectShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#2e2b28" flood-opacity=".28"/>
    </filter>
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#2e2b28" flood-opacity=".34"/>
    </filter>
    <g id="arm">
      <path d="M60 6 48 47 60 42 72 47Z" fill="url(#crystalFront)" stroke="#6e999c" stroke-width="1.2"/>
      <path d="M60 6 48 47 60 42Z" fill="url(#crystalLeft)"/>
      <path d="M60 6 72 47 60 42Z" fill="url(#crystalSide)"/>
      <path d="m60 13-3 25" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".82"/>
      <path d="m50 41 10 1 10-1" fill="none" stroke="#557f82" stroke-width=".8" opacity=".72"/>
      <path d="m50 32-9-7 5 15Z" fill="url(#crystalLeft)" stroke="#7ca5a7" stroke-width=".8"/>
      <path d="m70 32 9-7-5 15Z" fill="url(#crystalSide)" stroke="#668f92" stroke-width=".8"/>
    </g>
  </defs>
  <ellipse cx="60" cy="101" rx="39" ry="8" fill="#2e2b28" opacity=".16"/>
  <g filter="url(#objectShadow)">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60 60 60)"/>
    <use href="#arm" transform="rotate(120 60 60)"/>
    <use href="#arm" transform="rotate(180 60 60)"/>
    <use href="#arm" transform="rotate(240 60 60)"/>
    <use href="#arm" transform="rotate(300 60 60)"/>
    <path d="m60 38 19 11v22L60 82 41 71V49Z" fill="#8fb5b7" stroke="#587f82" stroke-width="1.3"/>
    <path d="m60 38 19 11-19 10-19-10Z" fill="#dceff0" opacity=".9"/>
    <path d="m41 49 19 10v23L41 71Z" fill="#b7d3d4" opacity=".9"/>
    <path d="m79 49-19 10v23l19-11Z" fill="#739c9f" opacity=".86"/>
  </g>
  <g filter="url(#coinShadow)">
    <rect x="38" y="45" width="44" height="30" rx="6" fill="url(#enamel)" stroke="#2e2b28" stroke-width="1.2"/>
    <path d="M42 49h36" stroke="#fff" stroke-width="1.2" opacity=".8"/>
    <text x="60" y="57.5" text-anchor="middle" fill="#2e2b28" font-family="Arial,Helvetica,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.25">LITTLE</text>
    <text x="60" y="70" text-anchor="middle" fill="#a8a66e" font-family="Georgia,serif" font-size="15" font-weight="700">6</text>
  </g>
  <path d="M24 59c8-10 17-18 27-24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".72"/>
</svg>
