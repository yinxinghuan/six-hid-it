<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" role="img" aria-labelledby="title desc">
  <title id="title">Lifted titanium espresso cup</title>
  <desc id="desc">A short titanium espresso cup lifted and tilted so only its opening faces the viewer.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#706b66"/>
      <stop offset=".12" stop-color="#aaa49e"/>
      <stop offset=".3" stop-color="#dfdbd5"/>
      <stop offset=".5" stop-color="#f4f1ec"/>
      <stop offset=".7" stop-color="#c8c2bb"/>
      <stop offset=".88" stop-color="#8d8781"/>
      <stop offset="1" stop-color="#65605b"/>
    </linearGradient>
    <radialGradient id="inside" cx=".5" cy=".38" r=".72">
      <stop offset="0" stop-color="#aaa39b"/>
      <stop offset=".58" stop-color="#817a73"/>
      <stop offset=".62" stop-color="#514c48"/>
      <stop offset=".78" stop-color="#d8d2cb"/>
      <stop offset="1" stop-color="#6c6660"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="6" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
  </defs>
  <g>
    <path fill="url(#metal)" d="M22 20c12-7 64-7 76 0 5 20 8 47 10 82-17 9-79 9-96 0 2-35 5-62 10-82Z"/>
    <path d="M22 20c13-7 63-7 76 0" fill="none" stroke="#d8d2cb" stroke-width="2.2" opacity=".8"/>
    <path fill="#fff" opacity=".16" d="M31 30c-4 23-6 46-6 67 5 2 9 3 13 3 0-26 2-50 5-71Z"/>
    <path fill="#4d4945" opacity=".1" d="M88 28c4 25 6 49 6 71 4-1 8-2 12-4-1-25-3-47-7-69Z"/>
    <ellipse cx="60" cy="103" rx="48" ry="11" fill="url(#inside)"/>
    <ellipse cx="60" cy="102" rx="39" ry="6.2" fill="#6e6862" opacity=".82"/>
    <ellipse cx="60" cy="101.5" rx="34" ry="4.2" fill="#484440" opacity=".88"/>
    <path d="M17 102c13 8 73 8 86 0" fill="none" stroke="#eee9e2" stroke-width="3"/>
    <path fill="none" stroke="#f1ede7" stroke-width="1.5" opacity=".7" d="M23 44c-2 18-3 34-3 50"/>
    <path fill="none" stroke="#fff" stroke-width="1" opacity=".22" d="M47 31c-2 20-2 42-1 62"/>
    <path filter="url(#grain)" fill="#fff" opacity=".1" d="M25 29c-3 18-5 42-5 68 16 7 64 7 80 0 0-26-2-50-5-68-17 7-53 7-70 0Z"/>
  </g>
</svg>
